<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>درخواست | ورودی ۱۴۰۲</title>
    <link rel="manifest" href="/manifest.webmanifest?v=20260722-200509">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=20260722-200509">
    <script src="/assets/site/scripts/theme.js?v=20260722-200509"></script>
    <link rel="stylesheet" href="/assets/site/styles/core.css?v=20260722-200509">
    <link rel="stylesheet" href="/assets/site/styles/theme.css?v=20260812-phase4b">
    <style>
        /* retired section (owner, 2026-11-12: the site is bot-first) */
        .retired { max-width: 560px; margin: 0 auto; padding: 48px 18px 120px; }
        .retired h2 { margin: 0 0 8px; font: 800 clamp(1.5rem, 5vw, 2rem)/1.45 var(--font-accent); color: var(--text-primary); }
        .retired p { margin: 0; color: var(--text-secondary); font-size: 1.02rem; line-height: 1.9; }
        .retired__actions { display: grid; gap: 10px; margin-top: 28px; }
        .retired__actions a { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 8px; font: 800 1rem var(--font-accent); text-decoration: none; }
        .retired__primary { background: var(--brand-navy-900); color: var(--text-on-accent); }
        html[data-theme="dark"] .retired__primary { background: var(--brand-brass); }
        .retired__secondary { border: 1px solid var(--border-color-strong); color: var(--text-primary); }
        .retired__actions a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    </style>
</head>
<body class="retired-page" data-back-href="/app/">
    <main class="retired">
        <h2>این بخش به ربات منتقل شد</h2>
        <p>ثبت و پیگیری درخواست‌ها حالا از ربات کلاس در تلگرام و بله انجام می‌شود. آزمون‌ها و نمونه‌سؤالات همچنان روی همین سایت است.</p>
        <div class="retired__actions">
            <a class="retired__primary" href="/exams/">رفتن به آزمون‌ها</a>
            <a class="retired__secondary" href="/app/">صفحهٔ اصلی</a>
        </div>
    </main>
    <script>
        /* keep the visitor's cohort: ?cohort=… or the cohort-specific /notes/<year>/ path */
        (function () {
            var query = new URLSearchParams(window.location.search || "");
            var cohort = String(query.get("cohort") || "").trim().toLowerCase();
            var match = window.location.pathname.match(/^\/notes\/(1403|1404)\//);
            if (!cohort && match) cohort = "dentistry-" + match[1];
            if (/^(1403|1404)$/.test(cohort)) cohort = "dentistry-" + cohort;
            if (!cohort || cohort === "main" || cohort === "1402" || cohort === "dentistry-1402") return;
            if (!/^[a-z0-9-]+$/.test(cohort)) return;
            document.querySelectorAll(".retired__actions a").forEach(function (link) {
                var url = new URL(link.getAttribute("href"), window.location.origin);
                url.searchParams.set("cohort", cohort);
                link.setAttribute("href", url.pathname + url.search);
            });
        })();
    </script>
    <script src="/assets/site/scripts/auth.js?v=20260722-200509"></script>
    <script src="/assets/site/scripts/shell.js?v=20260812-phase3b"></script>
    <script src="/assets/site/scripts/pwa.js?v=20260722-200509"></script>
</body>
</html>
