<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>خرید و پرداخت | ورودی ۱۴۰۲ دندانپزشکی</title>
    <meta name="description" content="صفحه عمومی آیتم‌های پرداخت لینک‌محور برای کمپین‌ها، رویدادها و هزینه‌های دانشجویی.">
    <meta name="theme-color" content="#eef2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ورودی ۱۴۰۲">
    <link rel="manifest" href="/manifest.webmanifest?v=20260429-151625">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=20260429-151625">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=20260429-151625">
    <script src="/assets/site/scripts/theme.js?v=20260429-151625"></script>
    <link rel="stylesheet" href="/assets/site/styles/core.css?v=20260429-151625">
    <link rel="stylesheet" href="/assets/site/styles/buy.css?v=20260429-151625">
    <link rel="stylesheet" href="/assets/site/styles/theme.css?v=20260429-151625">
</head>
<body class="buy-page" data-buy-page="list">
    <div class="background-overlay" aria-hidden="true"></div>

    <header class="site-header">
        <div class="logo-area">
            <div class="logo-circle">
                <img src="/assets/images/logo.png?v=20260422-brand1" alt="لوگوی ورودی ۱۴۰۲ دندانپزشکی">
            </div>
            <div class="site-info">
                <h1>خرید و پرداخت</h1>
                <p>لینک‌های عمومی پرداخت برای رویدادها، کمپین‌ها و هزینه‌های دانشجویی</p>
            </div>
        </div>
        <div class="header-actions">
            <a class="header-link" href="/app/">خانه</a>
        </div>
    </header>

    <main class="buy-shell buy-shell--market">
        <section class="buy-market-head" aria-label="جست‌وجوی پرداخت‌ها">
            <label class="buy-search">
                <span class="buy-search__icon" aria-hidden="true"></span>
                <input id="buy-search-input" type="search" autocomplete="off" placeholder="جست‌وجو در پرداخت‌ها">
            </label>
            <button id="buy-clear-search" class="buy-icon-btn" type="button" aria-label="پاک کردن جست‌وجو" hidden>
                <span aria-hidden="true">×</span>
            </button>
        </section>

        <button class="buy-location" type="button" aria-label="موقعیت پرداخت‌ها">
            <span class="buy-location__pin" aria-hidden="true"></span>
            <span>موقعیت: دانشکده دندانپزشکی تهران</span>
            <small>لینک‌های رسمی ورودی ۱۴۰۲</small>
        </button>

        <section class="buy-category-strip" aria-label="دسته‌بندی پرداخت‌ها">
            <button class="buy-category is-active" type="button" data-buy-category="all">
                <span class="buy-category__icon buy-category__icon--all" aria-hidden="true"></span>
                <span>همه</span>
            </button>
            <button class="buy-category" type="button" data-buy-category="event">
                <span class="buy-category__icon buy-category__icon--event" aria-hidden="true"></span>
                <span>رویداد</span>
            </button>
            <button class="buy-category" type="button" data-buy-category="class">
                <span class="buy-category__icon buy-category__icon--class" aria-hidden="true"></span>
                <span>کلاس</span>
            </button>
            <button class="buy-category" type="button" data-buy-category="exam">
                <span class="buy-category__icon buy-category__icon--exam" aria-hidden="true"></span>
                <span>آزمون</span>
            </button>
            <button class="buy-category" type="button" data-buy-category="order">
                <span class="buy-category__icon buy-category__icon--order" aria-hidden="true"></span>
                <span>سفارش</span>
            </button>
            <button class="buy-category" type="button" data-buy-category="saved">
                <span class="buy-category__icon buy-category__icon--saved" aria-hidden="true"></span>
                <span>نشان‌شده</span>
            </button>
        </section>

        <section class="buy-filter-bar" aria-label="فیلترهای سریع">
            <button class="buy-filter-chip is-active" type="button" data-buy-filter="all">همه پرداخت‌ها</button>
            <button class="buy-filter-chip" type="button" data-buy-filter="payable">قابل پرداخت</button>
            <button class="buy-filter-chip" type="button" data-buy-filter="limited">ظرفیت‌دار</button>
            <button class="buy-filter-chip" type="button" data-buy-filter="deadline">مهلت‌دار</button>
        </section>

        <section class="buy-market-section">
            <div class="buy-section-title">
                <div>
                    <span class="buy-kicker">پرداخت امن</span>
                    <h2>آیتم‌های فعال خرید</h2>
                </div>
                <p id="buy-list-count" class="buy-muted">در حال بارگذاری...</p>
            </div>
            <div id="buy-list-root" class="buy-feed" aria-live="polite">
                <div class="buy-empty">در حال بارگذاری آیتم‌های پرداخت...</div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>ورودی ۱۴۰۲ دندانپزشکی تهران</p>
    </footer>

    <script src="/assets/site/scripts/auth.js?v=20260429-151625"></script>
    <script src="/assets/site/scripts/buy.js?v=20260429-151625"></script>
    <script src="/assets/site/scripts/pwa.js?v=20260429-151625"></script>
    <script src="/assets/site/scripts/shell.js?v=20260429-151625"></script>
</body>
</html>
