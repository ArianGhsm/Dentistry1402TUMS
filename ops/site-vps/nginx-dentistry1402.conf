server {
    listen 80;
    listen [::]:80;
    server_name dentistry1402tums.ir www.dentistry1402tums.ir reader.dentistry1402tums.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/dentistry1402/shared/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://dentistry1402tums.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dentistry1402tums.ir www.dentistry1402tums.ir reader.dentistry1402tums.ir;

    ssl_certificate /etc/letsencrypt/live/dentistry1402tums.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dentistry1402tums.ir/privkey.pem;

    root /srv/dentistry1402/current/public_html;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 512m;

    access_log /var/log/nginx/dentistry1402.access.log;
    error_log /var/log/nginx/dentistry1402.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        try_files /app/index.html =404;
    }

    location ~ ^/dental-residency(?:/.*)?$ {
        return 410;
    }

    location = /booklets { return 301 /notes/; }
    location = /booklets/ { return 301 /notes/; }
    location = /booklets/index.html { return 301 /notes/; }
    location = /booklets1403 { return 301 /notes/1403/; }
    location = /booklets1403/ { return 301 /notes/1403/; }
    location = /booklets1403/index.html { return 301 /notes/1403/; }

    location ~ ^/prosthesis-1402(?:/index\.html)?/?$ { return 301 /notes/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/chat(?:/index\.html)?/?$ { return 301 /chat/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/forms/fill(?:/index\.html)?/?$ { return 301 /forms/fill/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/forms(?:/index\.html)?/?$ { return 301 /forms/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/grades(?:/index\.html)?/?$ { return 301 /grades/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/exams(?:/index\.html)?/?$ { return 301 /exams/?cohort=prosthesis-1402; }
    location ~ ^/prosthesis-1402/term(?:/index\.html)?/?$ { return 301 /notes/term/?cohort=prosthesis-1402; }

    location = /api/voice_payment_return.php {
        access_log off;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-dentistry1402.sock;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
    }

    location ~ "^/voice-pay/callback/([A-Za-z0-9_-]{20,80})$" {
        access_log off;
        proxy_pass http://127.0.0.1:18081/callback/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        limit_except GET POST { deny all; }
    }

    location ~ "^/voice-bale-pay/callback/([A-Za-z0-9_-]{20,80})$" {
        access_log off;
        proxy_pass http://127.0.0.1:18082/callback/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        limit_except GET POST { deny all; }
    }

    location ~ /\. { deny all; }
    location ~* \.(?:sql|sqlite|db|bak|backup|dump|log|env)$ { deny all; }
    location ^~ /storage/ { deny all; }
    location ^~ /server-only/ { deny all; }
    location ^~ /backups/ { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-dentistry1402.sock;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "public, no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
