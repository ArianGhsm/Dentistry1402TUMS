[dentistry1402]
user = dentweb
group = dentweb
listen = /run/php/php8.3-fpm-dentistry1402.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 15s
pm.max_requests = 500

clear_env = yes
env[DENT_STORAGE_ROOT] = /srv/dentistry1402/shared/storage
env[DENT_SERVER_ONLY_ROOT] = /srv/dentistry1402/shared/server-only
env[DENT_SESSION_SAVE_PATH] = /srv/dentistry1402/shared/server-only/sessions
env[DENT_ENV_FILE] = /srv/dentistry1402/shared/server-only/.env

php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_value[max_file_uploads] = 50
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 256M
php_admin_value[session.save_path] = /srv/dentistry1402/shared/server-only/sessions
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-dentistry1402.log
