name: CI Static Checks

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf

      - name: Verify runner PHP and qpdf
        run: |
          php -r 'foreach (["mbstring", "openssl", "curl"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "missing PHP extension: $extension\n"); exit(1); } }'
          qpdf --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deterministic bot runtime test dependencies
        run: |
          # The separate production/admin forensic venv intentionally follows
          # requirements-forensic.txt and the server's system Python. Repository
          # CI remains on the frozen Python 3.11 baseline, so use the newest
          # compatible NumPy with the same OpenCV build for detector coverage.
          python -m pip install --disable-pip-version-check \
            -r bot_runtime/requirements-bot-pdf.txt \
            pytest pikepdf \
            numpy==2.4.6 opencv-python-headless==5.0.0.93

      - name: Run deterministic static checks
        run: bash scripts/run_static_checks.sh

      - name: Run bot runtime deterministic tests
        env:
          PYTHONPATH: bot_runtime
        run: python -m pytest -q bot_runtime/tests
