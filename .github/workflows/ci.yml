name: CI Static Checks

on:
  push:
    branches:
      - main
    paths:
      - "public_html/**"
      - "scripts/**"
      - "bot_runtime/**"
      - "contracts/**"
      - "docs/**"
      - "AGENTS.md"
      - "DEPLOY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/ci.yml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "public_html/**"
      - "scripts/**"
      - "bot_runtime/**"
      - "contracts/**"
      - "docs/**"
      - "AGENTS.md"
      - "DEPLOY.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, openssl, curl
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install qpdf for bounded-memory PDF assembly tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf

      - name: Install deterministic bot runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r bot_runtime/requirements-bot-pdf.txt pytest pikepdf

      - name: Run deterministic static checks
        run: bash scripts/run_static_checks.sh

      - name: Run bot runtime deterministic tests
        env:
          PYTHONPATH: bot_runtime
        run: python -m pytest -q bot_runtime/tests
