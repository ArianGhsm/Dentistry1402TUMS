name: Temporary Drive Transfer
on:
  push:
    branches:
      - tmp-drive-transfer-20260919
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: drive-transfer
          path: transfer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
