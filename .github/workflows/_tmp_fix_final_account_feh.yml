name: Temporary Final Account FEH Repair

on:
  push:
    branches:
      - fix/website-persian-text-corruption
    paths:
      - ".github/workflows/_tmp_fix_final_account_feh.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-persian-text-corruption
          fetch-depth: 0

      - name: Apply final context-audited FEH repair and guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          account = Path('public_html/account/index.html')
          text = account.read_text(encoding='utf-8')
          bad = 'برای ورودی عال، کاربران را با متن ساده وارد کن.'
          good = 'برای ورودی فعال، کاربران را با متن ساده وارد کن.'
          if text.count(bad) != 1:
              raise SystemExit(f'expected exactly one audited corruption {bad!r}, found {text.count(bad)}')
          text = text.replace(bad, good, 1)
          account.write_text(text, encoding='utf-8')

          checker = Path('scripts/check_text_integrity.py')
          source = checker.read_text(encoding='utf-8')
          old = '    "ورود با موبایل را عال کن",\n    "قط‌خواندنی",'
          new = '    "ورود با موبایل را عال کن",\n    "برای ورودی عال",\n    "قط‌خواندنی",'
          if source.count(old) != 1:
              raise SystemExit('checker phrase insertion point mismatch')
          source = source.replace(old, new, 1)
          checker.write_text(source, encoding='utf-8')
          PY

          python3 scripts/check_text_integrity.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public_html/account/index.html')
          s = p.read_text(encoding='utf-8')
          if 'برای ورودی عال' in s or 'برای ورودی فعال، کاربران را با متن ساده وارد کن.' not in s:
              raise SystemExit('final account FEH repair assertion failed')
          PY
          git diff --check
          git diff -- public_html/account/index.html scripts/check_text_integrity.py

      - name: Commit final audited repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_html/account/index.html scripts/check_text_integrity.py
          git commit -m "fix: restore final account Persian FEH context"
          git push origin HEAD:fix/website-persian-text-corruption
