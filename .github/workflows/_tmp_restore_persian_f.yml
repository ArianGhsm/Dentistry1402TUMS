name: Temporary Persian Source Repair

on:
  push:
    branches:
      - fix/website-persian-text-corruption
    paths:
      - "scripts/_tmp_restore_persian_f.py"
      - ".github/workflows/_tmp_restore_persian_f.yml"

permissions:
  contents: write

jobs:
  repair-account-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/website-persian-text-corruption
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore only historically proven FEH deletions
        run: python3 scripts/_tmp_restore_persian_f.py

      - name: Validate repair diff
        run: |
          git diff --check
          git diff -- public_html/account/index.html
          test -n "$(git status --porcelain -- public_html/account/index.html)"

      - name: Commit repaired canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_html/account/index.html
          git commit -m "fix: restore corrupted Persian website copy"
          echo "REPAIR_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:fix/website-persian-text-corruption
